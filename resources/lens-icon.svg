<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Outer lens ring -->
  <circle cx="12" cy="12" r="10" stroke="#00FFFF" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Middle layer -->
  <ellipse cx="12" cy="12" rx="7" ry="4" stroke="#4A9EFF" stroke-width="1.2" fill="none" opacity="0.9"/>
  <!-- Inner focal point -->
  <circle cx="12" cy="12" r="2.5" fill="#00FFFF" opacity="0.95"/>
  <!-- Horizontal scan line -->
  <line x1="2" y1="12" x2="22" y2="12" stroke="#00FFFF" stroke-width="0.6" opacity="0.4"/>
</svg>
